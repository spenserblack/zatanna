name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check format
        run: |
          make format
          git diff --exit-code
      - name: Build
        run: make
      - name: Test
        run: make test
